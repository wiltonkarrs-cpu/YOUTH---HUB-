<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarship Portal | YOUTH HUB</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    color: #26344a;
    line-height: 1.6;
    background: #f4f7fb;
}

header {
    background: #071d3b;
    color: white;
    padding: 18px 7%;
    text-align: center;
}

.logo {
    color: #f5c542;
    font-size: 28px;
    font-weight: bold;
}

nav {
    margin-top: 12px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 8px;
}

nav a:hover {
    color: #f5c542;
}

.hero {
    background: linear-gradient(120deg, #071d3b, #14558a);
    color: white;
    text-align: center;
    padding: 75px 20px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

.hero span {
    color: #f5c542;
}

.hero p {
    max-width: 650px;
    margin: auto;
}

section {
    padding: 45px 8%;
    text-align: center;
}

h2 {
    color: #071d3b;
    margin-bottom: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h3 {
    color: #14558a;
    margin-bottom: 10px;
}

.icon {
    font-size: 38px;
    margin-bottom: 10px;
}

.guide {
    background: #f4f7fb;
}

.notice
